baseURL = 'https://esmoore.com/'
locale = 'en-us'
title = 'Eric S. Moore'

disableKinds = ["sitemap"]
ignoreLogs = ['warning-goldmark-raw-html']

[markup]
  [markup.highlight]
    codeFences = true
    noClasses = false
    lineNos = false
    guessSyntax = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions]
    typographer = true
    [markup.goldmark.extensions.extras]
      [markup.goldmark.extensions.extras.superscript]
        enable = true
  [markup.goldmark.parser]
    [markup.goldmark.parser.attribute]
      block = true
      title = true
[caches]
  [caches.images]
    dir = ':cacheDir/images'
[taxonomies]
[outputs]
  home = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]
[security.funcs]
  getenv = ['^HUGO_', '^CI$', '^CF_PAGES_']