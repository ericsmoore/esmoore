<h1 class="page-title">{{ .Title | markdownify }}</h1>
<p class="page-subtitle" >
  {{ with .Params.subtitle }}
    {{ . | markdownify }}
    {{ if and $.IsPage $.Date }}<nobr>&ndash;{{ end }}
  {{ end }}
   {{ if $.IsPage }}
    {{ with .Date }}
      </nobr>{{ .Format "2006.01.02" }}
    {{ end }}
  {{ end }}
</p>
